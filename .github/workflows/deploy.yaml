name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing tag to redeploy, for rolling back. Leave empty to build the
          current commit and deploy it by its SHA.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    env:
      IMAGE_REPOSITORY: ${{ secrets.IMAGE_REPOSITORY }}
      TARGET_TRIPLE: aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Resolve image tag
        id: image
        run: |
          # Deploying :latest meant the running bot silently changed to whatever
          # latest pointed at on any pod restart — imagePullPolicy is Always — and
          # the cluster could not tell you which commit was running. The SHA is
          # immutable and ties the pod to an exact commit.
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="$GITHUB_SHA"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install ARM64 cross toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add "$TARGET_TRIPLE"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          workspaces: |
            . -> target
          cache-targets: true
          cache-all-crates: true
          key: osr-bot-${{ env.TARGET_TRIPLE }}

      - name: Build OSR bot ARM64 binary
        shell: bash
        run: |
          cargo build --release --target "$TARGET_TRIPLE" --manifest-path src/osr-bot/rust/Cargo.toml

      - name: Stage runtime files
        shell: bash
        run: |
          mkdir -p dist/osr-bot
          cp "target/$TARGET_TRIPLE/release/osr-bot" dist/osr-bot/osr-bot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: src/osr-bot/docker/Dockerfile
          # provenance/sbom off keep this a plain manifest rather than an OCI
          # index. buildx wraps even a single-platform build in an index when
          # they are on, and GHCR lists that index's children as untagged
          # versions — which is what makes pruning "untagged" break live images.
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha,scope=osr-bot-package-image
          cache-to: type=gha,scope=osr-bot-package-image,mode=max

      - name: Prune old osr-bot versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55  # v5
        with:
          package-name: osr-bot
          package-type: container
          min-versions-to-keep: 5

  deploy:
    runs-on: arc-osr-bot
    needs: build
    env:
      IMAGE_REPOSITORY: ${{ secrets.IMAGE_REPOSITORY }}
      NAMESPACE: ${{ secrets.NAMESPACE }}
      GHCR_SECRET_NAME: ghcr-pull-secret
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede  # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Configure GHCR image pull secret
        shell: bash
        run: |
          kubectl create secret docker-registry "$GHCR_SECRET_NAME" \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PAT" \
            --docker-email="$GHCR_EMAIL" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_EMAIL: ${{ secrets.GHCR_EMAIL }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install osr-bot infra/chart/osr-bot \
            --namespace "$NAMESPACE" \
            --values infra/envs/values.yaml \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="${{ needs.build.outputs.tag }}" \
            --set-string image.pullPolicy=Always \
            --set-string imagePullSecrets[0].name="$GHCR_SECRET_NAME" \
            --set-string config.twitchUsername="$TWITCH_USERNAME" \
            --set-string config.twitchOauthToken="$TWITCH_OAUTH_TOKEN" \
            --set-string config.twitchClientId="$TWITCH_CLIENT_ID" \
            --set-string config.twitchClientSecret="$TWITCH_CLIENT_SECRET" \
            --set-string config.twitchRefreshToken="$TWITCH_REFRESH_TOKEN" \
            --set-string config.twitchChannel="$TWITCH_CHANNEL" \
            --set-string config.triggerText="$TRIGGER_TEXT" \
            --set-string config.responseText="$RESPONSE_TEXT" \
            --set-string config.responseDelaySeconds="$RESPONSE_DELAY_SECONDS" \
            --set-string config.minCooldownSeconds="$MIN_COOLDOWN_SECONDS" \
            --set-string config.coordinateCommandText="$COORDINATE_COMMAND_TEXT" \
            --set-string config.postPlayCoordinateDelaySeconds="$POST_PLAY_COORDINATE_DELAY_SECONDS" \
            --set-string config.deathTriggerText="$DEATH_TRIGGER_TEXT" \
            --set-string config.deathCoordinateDelaySeconds="$DEATH_COORDINATE_DELAY_SECONDS" \
            --set-string config.minCoordinateCooldownSeconds="$MIN_COORDINATE_COOLDOWN_SECONDS" \
            --atomic \
            --wait \
            --timeout 180s
        env:
          TWITCH_USERNAME: ${{ secrets.TWITCH_USERNAME }}
          TWITCH_OAUTH_TOKEN: ${{ secrets.TWITCH_OAUTH_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          TWITCH_CHANNEL: ${{ secrets.TWITCH_CHANNEL }}
          TRIGGER_TEXT: ${{ secrets.TRIGGER_TEXT }}
          RESPONSE_TEXT: ${{ secrets.RESPONSE_TEXT }}
          RESPONSE_DELAY_SECONDS: ${{ secrets.RESPONSE_DELAY_SECONDS }}
          MIN_COOLDOWN_SECONDS: ${{ secrets.MIN_COOLDOWN_SECONDS }}
          COORDINATE_COMMAND_TEXT: ${{ secrets.COORDINATE_COMMAND_TEXT }}
          POST_PLAY_COORDINATE_DELAY_SECONDS: ${{ secrets.POST_PLAY_COORDINATE_DELAY_SECONDS }}
          DEATH_TRIGGER_TEXT: ${{ secrets.DEATH_TRIGGER_TEXT }}
          DEATH_COORDINATE_DELAY_SECONDS: ${{ secrets.DEATH_COORDINATE_DELAY_SECONDS }}
          MIN_COORDINATE_COOLDOWN_SECONDS: ${{ secrets.MIN_COORDINATE_COOLDOWN_SECONDS }}

      - name: Verify deployed image
        # A vendored copy, unlike the other repos which use the shared action in
        # arc-system. This repository is public and arc-system is private, and a
        # public repo cannot consume an action from a private one. arc-system
        # cannot be made public either: it holds committed kubeconfigs with
        # non-expiring service-account tokens. Keep this in sync by hand.
        run: |
          chmod +x scripts/ci/verify-deployed-image.sh
          scripts/ci/verify-deployed-image.sh "$NAMESPACE" deploy/osr-bot \
            "$IMAGE_REPOSITORY:${{ needs.build.outputs.tag }}"
